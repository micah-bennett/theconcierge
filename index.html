<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icons — HOP icon from design/HOP-Logo-Pack/06-Social-Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=11" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=11" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=11" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=11" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=11" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HOP — Hospitality On-Site Professionals. Human-centered support for professionals and organizations."
    />

    <!-- Social sharing. NOTE: this is a client-rendered SPA with no SSR or
         prerendering, so index.html is served for every route — every shared
         URL previews with these same tags. Per-route previews would require
         prerendering; per-route <title> is handled at runtime by usePageTitle. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HOP" />
    <meta property="og:title" content="HOP | Hospitality On-Site Professionals" />
    <meta
      property="og:description"
      content="HOP brings responsive, human-centered support to professionals and organizations—helping people manage the details, stay connected, and build a stronger workplace experience."
    />
    <meta property="og:image" content="https://theconcierge.life/og-team.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HOP — Hospitality On-Site Professionals" />
    <meta property="og:url" content="https://theconcierge.life/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HOP | Hospitality On-Site Professionals" />
    <meta
      name="twitter:description"
      content="HOP brings responsive, human-centered support to professionals and organizations—helping people manage the details, stay connected, and build a stronger workplace experience."
    />
    <meta name="twitter:image" content="https://theconcierge.life/og-team.jpg" />
    <meta name="theme-color" content="#053069" />
    <title>HOP | Hospitality On-Site Professionals</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

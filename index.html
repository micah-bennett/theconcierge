<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icons — black background, white C logo -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=10" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=10" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=10" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=10" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Concierge — a Hudson Valley concierge team. Transportation, errands, healthcare logistics, and lifestyle support for professionals, families, and businesses."
    />

    <!-- Social sharing. NOTE: this is a client-rendered SPA with no SSR or
         prerendering, so index.html is served for every route — every shared
         URL previews with these same tags. Per-route previews would require
         prerendering; per-route <title> is handled at runtime by usePageTitle. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Concierge" />
    <meta property="og:title" content="The Concierge — Hudson Valley concierge team" />
    <meta
      property="og:description"
      content="A full concierge team supporting busy professionals, healthcare staff, families, and businesses throughout the Hudson Valley."
    />
    <meta property="og:image" content="https://theconcierge.life/og-team.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Concierge team" />
    <meta property="og:url" content="https://theconcierge.life/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Concierge — Hudson Valley concierge team" />
    <meta
      name="twitter:description"
      content="A full concierge team supporting busy professionals, healthcare staff, families, and businesses throughout the Hudson Valley."
    />
    <meta name="twitter:image" content="https://theconcierge.life/og-team.jpg" />
    <meta name="theme-color" content="#070b14" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>The Concierge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
